{% load static %}
<!DOCTYPE html>
<html lang='ru'>
{% include 'inc/_head.html' %}
<script>
function showToast({ icon = "info", title = "", text = "", timer = 4000 }) {
    Swal.fire({
        icon,
        title,
        text,
        showConfirmButton: false,
        timerProgressBar: true,
        didOpen: (toast) => {
            toast.addEventListener("mouseenter", Swal.stopTimer);
            toast.addEventListener("mouseleave", Swal.resumeTimer);
        }
    });
}
</script>
<body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <main class="app-shell">
        {% include 'inc/_my_servers.html' %}
        <aside class="aside" aria-label="Навигация по разделу">
            {% block aside %}{% endblock %}
        </aside>
        <section class="content" id="main-content" aria-label="Основное содержимое">
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
